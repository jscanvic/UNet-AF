# Consolidated test configs. Each key names a test and refers to a training config via `base` (optional).
# Entries should contain only non-redundant overrides; when `base` is present the training
# config is loaded and the `overrides` are applied on top.

defaults:
  overrides:
    epochs: 0
    run_name_prefix: "Test_"
    eq_metric_kind: "basic"
    eq_metric_backbone: "psnr"

tests:
  Main_UNet-AF:
    base: "Main_UNet-AF.yaml"
    overrides:
      checkpoint_path: "Main_UNet-AF.pth.tar"
      checkpoint_run_id: "ae436862cb9a495baaa830ad72a28b86"

