[project]
name = "unet_af"
version = "0.1.0"
description = "The simplicity and effectiveness of UNet architectures make them ubiquitous in image restoration, segmentation, and diffusion models. They are often assumed to be equivariant to translations, yet they traditionally consist of layers that are known to be prone to aliasing, which hinders their equivariance in practice. To overcome this limitation, we show how to build sub-pixel translation-equivariant UNet architectures by appropriately choosing their main components (convolution, pooling, downsampling, activation, and normalization layers) to be alias-free. We evaluate the proposed equivariant architectures against non-equivariant baselines on image restoration tasks and observe competitive performance with a significant increase in measured equivariance. Through extensive ablation studies, we also demonstrate the importance of every architectural choice to achieve high equivariance."
readme = "README.md"
requires-python = "~=3.12.1"
dependencies = [
    "torch>=2.4.1,<2.9.0",
    "torchvision>=0.19.1,<0.24.0",
    "deepinv==0.3.7",
    "numpy",
    "escnn",
    "mlflow",
    "huggingface_hub",
    "Pillow",
    "matplotlib",
    "requests",
    "pandas"
]

[project.scripts]
post_install = "post_install:main"
generate_datasets = "generate_datasets:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["unet_af", "unet_af.*"]
namespaces = true

[tool.setuptools.package-data]
unet_af = ["test.yaml", "configs/*.yaml", "filters/*.pt"]
"unet_af.ops.stylegan3" = ["LICENSE.txt"]
"unet_af.ops.stylegan3.bias_act" = ["*.cpp", "*.cu", "*.h"]
"unet_af.ops.stylegan3.filtered_lrelu" = ["*.cpp", "*.cu", "*.h"]
"unet_af.ops.stylegan3.upfirdn2d" = ["*.cpp", "*.cu", "*.h"]

[tool.uv]
managed = false

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]

ignore = ["E501"]

exclude = ["trainer.py", "ronneberger.py"]

# Optional development dependencies (install via e.g. `pip install .[dev]`)
[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

# Pytest configuration to make test discovery deterministic for this package
[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-q --color=no"
python_files = ["test_*.py"]
filterwarnings = [
  "ignore::DeprecationWarning",
]
